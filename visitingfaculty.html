<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Building Model</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #333;
            font-family: sans-serif;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 0 #fff;
        }
    </style>
</head>
<body>
    <div id="info">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            // 1. Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 200, 500);

            // 2. Setup Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(150, 100, 150); // High angle to see top and side

            // 3. Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(100, 200, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // --- BUILDING GENERATION ---
            createBuilding();
            createGround();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createBuilding() {
            const buildingGroup = new THREE.Group();

            // Dimensions
            const size = 100;    // Width/Depth of the building
            const height = 40;   // Height of the building
            const wallDepth = 15; // Thickness of the building wings

            // Materials
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }); // White
            const windowMaterial = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.2, metalness: 0.8 }); // Dark glass
            const redAccentMaterial = new THREE.MeshStandardMaterial({ color: 0xcc0000 }); // Red panels
            const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 }); // Grey roof

            // Helper to create one side/wing of the building
            function createWing() {
                const wingGroup = new THREE.Group();

                // 1. Main Wall Block
                const wallGeo = new THREE.BoxGeometry(size, height, wallDepth);
                const wall = new THREE.Mesh(wallGeo, wallMaterial);
                wall.castShadow = true;
                wall.receiveShadow = true;
                wingGroup.add(wall);

                // 2. Windows & Red Accents Grid
                // We will procedurally place boxes to simulate the pattern in the photo
                const startX = -size / 2 + 5;
                const endX = size / 2 - 5;
                const startY = -height / 2 + 5;
                const endY = height / 2 - 2;

                const cols = 12;
                const rows = 6;
                const stepX = (size - 10) / cols;
                const stepY = (height - 10) / rows;

                for (let i = 0; i < cols; i++) {
                    // Decide if this column is a Red Accent or Window column
                    // Pattern: Roughly 2 windows, 1 red, repeat (randomized slightly for look)
                    const isRedPanel = (i % 4 === 2) || (i % 4 === 3 && Math.random() > 0.5);

                    for (let j = 0; j < rows; j++) {
                        const x = startX + i * stepX + stepX/2;
                        const y = startY + j * stepY + stepY/2;
                        const z = wallDepth / 2 + 0.1; // Slightly protruding

                        if (isRedPanel) {
                            // Vertical Red Panel
                            // Connect vertical segments to make it look like a tall strip
                            const panelH = stepY + 1; 
                            const panelGeo = new THREE.BoxGeometry(stepX * 0.8, panelH, 1);
                            const panel = new THREE.Mesh(panelGeo, redAccentMaterial);
                            panel.position.set(x, y, z);
                            wingGroup.add(panel);
                        } else {
                            // Standard Window
                            const winGeo = new THREE.BoxGeometry(stepX * 0.6, stepY * 0.6, 0.5);
                            const win = new THREE.Mesh(winGeo, windowMaterial);
                            win.position.set(x, y, z);
                            wingGroup.add(win);
                        }
                    }
                }
                
                // 3. Roof cap for this wing
                const roofGeo = new THREE.BoxGeometry(size + 2, 2, wallDepth + 2);
                const roof = new THREE.Mesh(roofGeo, roofMaterial);
                roof.position.y = height / 2 + 1;
                wingGroup.add(roof);

                return wingGroup;
            }

            // Assemble 4 sides to form a hollow square
            // Offset distance (distance from center to wall center)
            const offset = (size - wallDepth) / 2;

            // Front
            const front = createWing();
            front.position.z = offset;
            buildingGroup.add(front);

            // Back
            const back = createWing();
            back.rotation.y = Math.PI;
            back.position.z = -offset;
            buildingGroup.add(back);

            // Left
            const left = createWing();
            left.rotation.y = -Math.PI / 2;
            left.position.x = -offset;
            buildingGroup.add(left);

            // Right
            const right = createWing();
            right.rotation.y = Math.PI / 2;
            right.position.x = offset;
            buildingGroup.add(right);

            // --- CENTRAL TENSILE ROOF (The Spider Web) ---
            createTensileStructure(buildingGroup, size, height);

            scene.add(buildingGroup);
        }

        function createTensileStructure(parentGroup, buildingSize, buildingHeight) {
            // The inner courtyard size
            const innerSize = buildingSize * 0.6; 
            
            // 1. The Fabric (Cone-like shape)
            // We use a cylinder with top radius 0 to make a cone, but segment it highly
            const fabricGeo = new THREE.ConeGeometry(innerSize / 1.5, 15, 16, 4, true);
            const fabricMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                roughness: 0.9
            });
            const fabric = new THREE.Mesh(fabricGeo, fabricMat);
            fabric.position.y = buildingHeight / 2 - 5; // Sits slightly below roof line
            fabric.rotation.y = Math.PI / 4; // Rotate to align corners if needed
            
            parentGroup.add(fabric);

            // 2. The "Spider Web" Structure (Wireframe overlay)
            // We create a wireframe geometry to simulate the cables seen in the top view
            const wireframeGeo = new THREE.WireframeGeometry(fabricGeo);
            const wireframeMat = new THREE.LineBasicMaterial({ color: 0x8B4513, linewidth: 2 }); // Brownish/dark ropes
            const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
            wireframe.position.copy(fabric.position);
            wireframe.rotation.copy(fabric.rotation);
            parentGroup.add(wireframe);

            // 3. Central Ring/Cap
            const capGeo = new THREE.CylinderGeometry(2, 2, 1, 16);
            const capMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 }); // Dark red center
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.set(0, buildingHeight / 2 + 2.5, 0); // Tip of the tent
            parentGroup.add(cap);

            // 4. Corner Anchors (Cables going to corners)
            // Visual lines from center top to the inner corners of the building
            const cableMat = new THREE.LineBasicMaterial({ color: 0x555555 });
            const corners = [
                new THREE.Vector3(-innerSize/2, buildingHeight/2, -innerSize/2),
                new THREE.Vector3(innerSize/2, buildingHeight/2, -innerSize/2),
                new THREE.Vector3(innerSize/2, buildingHeight/2, innerSize/2),
                new THREE.Vector3(-innerSize/2, buildingHeight/2, innerSize/2)
            ];
            
            const topPoint = new THREE.Vector3(0, buildingHeight/2 + 2.5, 0);

            corners.forEach(corner => {
                const points = [topPoint, corner];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, cableMat);
                parentGroup.add(line);
            });
        }

        function createGround() {
            // Simple grass ground
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -20; // Base of building is at 0, building height extends up/down
            // Adjust ground to be at the bottom of the building
            ground.position.y = -20; 
            scene.add(ground);
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(500, 50);
            gridHelper.position.y = -19.9;
            scene.add(gridHelper);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
