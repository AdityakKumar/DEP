<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Green & Yellow Building</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #e6eac8; } /* Very pale leafy background */
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #2c3e2c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            font-size: 16px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Detailed Model: Rooms & Balconies<br><span style="font-size: 12px; font-weight: normal;">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</span></div>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdbead5); // Pale misty green sky
            scene.fog = new THREE.Fog(0xdbead5, 200, 900);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 400, 250); 
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2); // Warm sunlight
            dirLight.position.set(150, 300, 100);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 4096; // High res shadows for balcony details
            dirLight.shadow.mapSize.height = 4096;
            dirLight.shadow.camera.left = -200;
            dirLight.shadow.camera.right = 200;
            dirLight.shadow.camera.top = 200;
            dirLight.shadow.camera.bottom = -200;
            scene.add(dirLight);

            // 5. Materials (The Requested Palette)
            const palette = {
                wall: new THREE.MeshStandardMaterial({ color: 0xfdfbd3, roughness: 0.6 }), // Pale Yellow
                roof: new THREE.MeshStandardMaterial({ color: 0xa8a890, roughness: 0.9 }), // Concrete Grey
                balconyFloor: new THREE.MeshStandardMaterial({ color: 0x3e5f3e, roughness: 0.8 }), // Green floor
                railing: new THREE.MeshStandardMaterial({ color: 0x2f4f2f, metalness: 0.1 }), // Dark Green Metal
                windowGlass: new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.2, metalness: 0.8 }), // Dark Glass
                courtyard: new THREE.MeshStandardMaterial({ color: 0x3b4d3b }), // Dark green grass/floor
                dome: new THREE.MeshStandardMaterial({ color: 0xffffee, roughness: 0.4 }) // Shiny white/yellow dome
            };

            const buildingGroup = new THREE.Group();
            const buildingHeight = 25; // Slightly taller to fit floors
            const floorCount = 5;
            const floorHeight = buildingHeight / floorCount;

            // --- Function to create a Detailed Wing ---
            function createDetailedBlock(x, z, width, depth, hasCourtyard = false) {
                const group = new THREE.Group();
                group.position.set(x, 0, z);

                // 1. Core Structure (The Room Volume)
                // We make it slightly smaller than width/depth to allow balconies to stick out
                const coreW = width - 2;
                const coreD = depth - 2;
                
                const coreGeo = new THREE.BoxGeometry(coreW, buildingHeight, coreD);
                const core = new THREE.Mesh(coreGeo, palette.wall);
                core.position.y = buildingHeight / 2;
                core.castShadow = true;
                core.receiveShadow = true;
                group.add(core);

                // 2. Roof
                const roofGeo = new THREE.BoxGeometry(width, 1, depth);
                const roof = new THREE.Mesh(roofGeo, palette.roof);
                roof.position.y = buildingHeight + 0.5;
                roof.receiveShadow = true;
                group.add(roof);

                // 3. Facade Generation (Balconies & Rooms)
                // We create horizontal strips for balconies
                
                // Horizontal Green Slabs (Floors)
                for (let i = 1; i <= floorCount; i++) {
                    const yPos = i * floorHeight - (floorHeight/2); // Position at bottom of window level
                    
                    // Balcony Slab (Green)
                    // Make it slightly wider than core to stick out
                    const slabGeo = new THREE.BoxGeometry(width, 0.5, depth);
                    const slab = new THREE.Mesh(slabGeo, palette.balconyFloor);
                    slab.position.y = (i * floorHeight); 
                    slab.castShadow = true;
                    group.add(slab);

                    // Add Vertical Dividers (Columns) to simulate rooms
                    // We place them along the perimeter
                    const perimeter = (width * 2 + depth * 2);
                    const roomWidth = 10; 
                    const stepsX = Math.floor(width / roomWidth);
                    const stepsZ = Math.floor(depth / roomWidth);

                    // Side dividers (along Depth)
                    for(let k = 0; k <= stepsZ; k++) {
                        const divZ = -depth/2 + (k * (depth/stepsZ));
                        
                        // Left Side
                        const pLeft = new THREE.Mesh(new THREE.BoxGeometry(1, floorHeight, 1), palette.wall);
                        pLeft.position.set(-width/2, yPos - floorHeight/2, divZ);
                        group.add(pLeft);

                        // Right Side
                        const pRight = new THREE.Mesh(new THREE.BoxGeometry(1, floorHeight, 1), palette.wall);
                        pRight.position.set(width/2, yPos - floorHeight/2, divZ);
                        group.add(pRight);
                        
                        // Windows (Simple recessed planes between columns)
                        if (k < stepsZ) {
                            const winH = floorHeight * 0.6;
                            const winGeo = new THREE.BoxGeometry(0.5, winH, (depth/stepsZ) - 2);
                            
                            // Left Window
                            const wLeft = new THREE.Mesh(winGeo, palette.windowGlass);
                            wLeft.position.set(-width/2 + 0.5, yPos - floorHeight/2, divZ + (depth/stepsZ)/2);
                            group.add(wLeft);
                            
                            // Right Window
                            const wRight = new THREE.Mesh(winGeo, palette.windowGlass);
                            wRight.position.set(width/2 - 0.5, yPos - floorHeight/2, divZ + (depth/stepsZ)/2);
                            group.add(wRight);
                        }
                    }
                }

                // 4. Courtyard (if strictly requested)
                if (hasCourtyard) {
                    const cyGeo = new THREE.PlaneGeometry(width * 0.4, depth * 0.4);
                    const cy = new THREE.Mesh(cyGeo, palette.courtyard);
                    cy.rotation.x = -Math.PI / 2;
                    cy.position.y = buildingHeight + 0.6; // On roof
                    group.add(cy);
                }

                buildingGroup.add(group);
            }

            // --- REBUILDING THE SHAPE USING NEW FUNCTION ---
            // Coordinates preserved from your provided code
            const wingW = 32;

            // 1. Top Wings
            createDetailedBlock(-40, -70, wingW, 70, true); 
            createDetailedBlock( 40, -70, wingW, 70, true); 

            // 2. Central Horizontal Connector
            createDetailedBlock(0, -15, 60, 35); 

            // 3. Middle Wings
            createDetailedBlock(-40, 25, wingW, 45); 
            createDetailedBlock( 40, 25, wingW, 45); 

            // 4. Stepped Outward Connectors (Simplified detail for small blocks)
            createDetailedBlock(-54, 55, 28, wingW); 
            createDetailedBlock( 54, 55, 28, wingW); 

            // 5. Bottom Wings (Long)
            createDetailedBlock(-68, 115, wingW, 110, true); 
            createDetailedBlock( 68, 115, wingW, 110, true); 

            // --- CENTRAL OVAL DOME ---
            const domeGeo = new THREE.SphereGeometry(22, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const dome = new THREE.Mesh(domeGeo, palette.dome);
            dome.scale.set(1.3, 0.6, 2.0); 
            dome.position.set(0, buildingHeight + 0.2, -15); 
            dome.castShadow = true;
            buildingGroup.add(dome);

            // Tanks
            for(let i=0; i<6; i++) {
                const tank = new THREE.Mesh(
                    new THREE.CylinderGeometry(2, 2, 4, 16),
                    new THREE.MeshStandardMaterial({color: 0xeeeeee})
                );
                tank.position.set(-15 + (i*6), buildingHeight + 2, 10);
                tank.castShadow = true;
                buildingGroup.add(tank);
            }

            scene.add(buildingGroup);

            // 6. Ground Plane (Earthy Green)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(1500, 1500),
                new THREE.MeshStandardMaterial({ color: 0x6e8c6e }) 
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Add paths
            const pathGeo = new THREE.PlaneGeometry(100, 1500);
            const pathMat = new THREE.MeshStandardMaterial({color: 0x888888});
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.y = 0.1;
            scene.add(path);

            // 7. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; 

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
